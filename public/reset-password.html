<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0F5C47">
  <meta name="robots" content="noindex,nofollow">
  <title>تغییر رمز | هم‌ساخت</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/workspace.css">
</head>
<body>
  <main class="ws-auth">
    <section class="ws-auth__story" aria-labelledby="resetStoryTitle">
      <a class="ws-brand ws-brand--light" href="/">
        <img src="/favicon.svg" alt="" width="40" height="40">
        <span><strong>هم‌ساخت</strong><small>امنیت حساب</small></span>
      </a>
      <div class="ws-auth__copy">
        <span class="ws-kicker">بازیابی امن دسترسی</span>
        <h1 id="resetStoryTitle">یک رمز تازه انتخاب کنید</h1>
        <p>پس از تغییر رمز، همهٔ نشست‌های قبلی حساب شما باطل خواهند شد.</p>
      </div>
    </section>
    <section class="ws-auth__panel">
      <div class="ws-auth__card">
        <span class="ws-kicker">تغییر رمز</span>
        <h2 id="resetTitle">رمز شخصی جدید</h2>
        <p>حداقل ۱۲ نویسه و ترکیبی غیرقابل حدس انتخاب کنید.</p>
        <div id="resetError" class="ws-alert ws-alert--error" role="alert" hidden></div>
        <form id="resetForm" class="ws-form">
          <label><span>رمز جدید</span><input name="password" type="password" required minlength="12" autocomplete="new-password"></label>
          <label><span>تکرار رمز</span><input name="passwordConfirm" type="password" required minlength="12" autocomplete="new-password"></label>
          <button class="ws-button ws-button--primary ws-button--block" type="submit">ثبت رمز جدید</button>
        </form>
        <a id="loginLink" class="ws-button ws-button--secondary ws-button--block" href="/workspace" hidden>ورود به فضای کاری</a>
      </div>
    </section>
  </main>
  <script type="module" src="/reset-password.js"></script>
</body>
</html>
