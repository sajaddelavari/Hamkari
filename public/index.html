<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0F5C47">
  <meta name="color-scheme" content="light">
  <meta name="description" content="هم‌ساخت؛ پرتفوی شفاف پروژه‌ها برای مشارکت، سرمایه، عملکرد و حاکمیت قابل پیگیری.">
  <title>هم‌ساخت | پرتفوی شفاف پروژه‌ها</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">رفتن به محتوای اصلی</a>

  <header class="site-header" id="site-header">
    <div class="container header-inner">
      <a class="brand" href="/" data-app-link aria-label="هم‌ساخت، صفحه اصلی">
        <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
          <rect x="4" y="4" width="14" height="14" rx="4"></rect>
          <rect x="22" y="4" width="14" height="14" rx="4"></rect>
          <rect x="4" y="22" width="14" height="14" rx="4"></rect>
          <path d="M22 22h5a4 4 0 0 0 4-4v-1h1a4 4 0 0 1 4 4v11a4 4 0 0 1-4 4H22V22Z"></path>
        </svg>
        <span class="brand-copy">
          <strong>هم‌ساخت</strong>
          <small>پرتفوی شفاف پروژه‌ها</small>
        </span>
      </a>

      <nav class="main-nav" aria-label="ناوبری اصلی">
        <a id="project-nav-link" href="/projects" data-app-link>پروژه‌ها</a>
        <a href="/marketplace">بازار فرصت‌ها</a>
        <a href="/my-proposals" data-app-link>
          پیگیری‌های من
          <span id="tracking-count" class="nav-count" hidden></span>
        </a>
      </nav>

      <div class="connection-indicators" aria-live="polite">
        <span id="live-indicator" class="connection-badge is-live" hidden>
          <span class="connection-dot" aria-hidden="true"></span>
          به‌روز
        </span>
        <span id="offline-indicator" class="connection-badge is-offline" hidden>
          آفلاین
        </span>
      </div>
    </div>
  </header>

  <main id="main-content" tabindex="-1">
    <div class="container initial-loader" aria-busy="true" aria-label="در حال بارگذاری">
      <div class="skeleton skeleton-line skeleton-short"></div>
      <div class="skeleton skeleton-title"></div>
      <div class="skeleton skeleton-line"></div>
      <div class="skeleton-grid">
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
      </div>
    </div>
  </main>

  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>

  <noscript>
    <div class="noscript-message">
      برای مشاهده و پیگیری پیشنهادهای همکاری، جاوااسکریپت مرورگر را فعال کنید.
    </div>
  </noscript>

  <script type="module" src="/app.js"></script>
  <script type="module" src="/pwa.js"></script>
</body>
</html>
