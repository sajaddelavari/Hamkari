<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0F5C47">
  <meta name="robots" content="noindex,nofollow">
  <title>پذیرش دعوت | هم‌ساخت</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/workspace.css">
</head>
<body>
  <main class="ws-auth">
    <section class="ws-auth__story" aria-labelledby="inviteStoryTitle">
      <a class="ws-brand ws-brand--light" href="/">
        <img src="/favicon.svg" alt="" width="40" height="40">
        <span><strong>هم‌ساخت</strong><small>دعوت سازمانی</small></span>
      </a>
      <div class="ws-auth__copy">
        <span class="ws-kicker">یک فضای مشترک و شفاف</span>
        <h1 id="inviteStoryTitle">به تیم پروژه بپیوندید</h1>
        <p>نقش و دسترسی شما از سوی مدیر سازمان تعیین شده و پس از پذیرش قابل مشاهده است.</p>
      </div>
    </section>
    <section class="ws-auth__panel">
      <div class="ws-auth__card">
        <span class="ws-kicker">پذیرش دعوت</span>
        <h2 id="inviteTitle">در حال بررسی دعوت…</h2>
        <p id="inviteDescription">اعتبار و مشخصات دعوت در حال دریافت است.</p>
        <div id="inviteError" class="ws-alert ws-alert--error" role="alert" hidden></div>
        <form id="invitationForm" class="ws-form" hidden>
          <label><span>نام و نام خانوادگی</span><input name="fullName" required maxlength="160" autocomplete="name"></label>
          <label><span>رمز شخصی</span><input name="password" type="password" required minlength="12" autocomplete="new-password"></label>
          <label><span>تکرار رمز</span><input name="passwordConfirm" type="password" required minlength="12" autocomplete="new-password"></label>
          <button class="ws-button ws-button--primary ws-button--block" type="submit">پذیرش و ورود</button>
        </form>
        <a id="workspaceLink" class="ws-button ws-button--secondary ws-button--block" href="/workspace" hidden>رفتن به فضای کاری</a>
      </div>
    </section>
  </main>
  <script type="module" src="/accept-invitation.js"></script>
</body>
</html>
